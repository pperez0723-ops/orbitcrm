<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ORBIT · Mission Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#030a12;--hull:#05101e;--panel:#071628;
  --red:#e8303a;--rs:#ff5d66;--teal:#00e5ff;--green:#36d399;
  --amber:#f4b942;--violet:#a78bfa;--pink:#f472b6;--orange:#fb923c;
  --ice:#7dd3fc;--gold:#f0c96b;
  --ink:#dff0ff;--dim:#5a8aaa;--faint:#2a4a6a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Orbitron',monospace;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
.page{max-width:1300px;margin:0 auto;padding:10px 14px 28px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:linear-gradient(180deg,#0a1e36,#040e1c);border-bottom:1px solid #0e2840;margin-bottom:10px;border-radius:6px}
.tl{font-size:17px;font-weight:900;letter-spacing:.15em;color:var(--teal);text-shadow:0 0 18px #00e5ff88}
.ts{font-size:8px;letter-spacing:.2em;color:var(--dim);margin-top:2px}
.tr{display:flex;gap:14px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.dg{background:var(--green);box-shadow:0 0 8px var(--green)}
.da{background:var(--amber)}
.dr{background:var(--red);box-shadow:0 0 8px var(--red);animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:.15}}
#clk{color:var(--teal);letter-spacing:.1em}

.ship-wrap{background:var(--hull);border:1px solid #0e2840;border-radius:8px;overflow:hidden;margin-bottom:10px;position:relative}
.ship-wrap svg{width:100%;display:block}

.term-wrap{background:#020910;border:1px solid #0e2840;border-radius:8px;overflow:hidden;margin-bottom:10px}
.tbar{display:flex;align-items:center;gap:7px;padding:7px 12px;background:#030d1c;border-bottom:1px solid #0e2840}
.tdots{display:flex;gap:5px}.tdots i{width:9px;height:9px;border-radius:50%}
.tdots i:nth-child(1){background:#ff5f57}.tdots i:nth-child(2){background:#febc2e}.tdots i:nth-child(3){background:#28c840}
.tlbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase}
.tbody{height:200px;overflow-y:auto;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;background:#020910}
.tbody::-webkit-scrollbar{width:5px}.tbody::-webkit-scrollbar-thumb{background:#0e2840;border-radius:3px}
.ln{display:flex;gap:6px;white-space:pre-wrap;word-break:break-word;animation:fi .16s ease}
@keyframes fi{from{opacity:0}}
.pr{color:var(--rs)}.cm{color:var(--ink)}.ok{color:var(--green)}.wa{color:var(--amber)}.in{color:var(--teal)}.mu{color:var(--dim)}.fi{color:var(--violet)}.ad{color:var(--green)}.de{color:#ff7a82}.ba{color:var(--red)}.hd{color:var(--faint)}
.cur{display:inline-block;width:6px;height:12px;background:var(--red);vertical-align:-2px;animation:cu 1s steps(1) infinite}
@keyframes cu{50%{opacity:0}}

.ctrl{background:var(--panel);border:1px solid #0e2840;border-radius:8px;padding:12px}
.clbl{font-size:7px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.crow{display:flex;gap:8px}
.cinp{flex:1;background:#020b18;border:1px solid #0e2840;border-radius:6px;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:13px;padding:11px 13px}
.cinp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px #00e5ff1a}
.cinp::placeholder{color:var(--faint)}
.rbtn{background:linear-gradient(180deg,#d42030,#8a0f18);border:none;border-radius:6px;padding:0 20px;color:#fff;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;cursor:pointer;white-space:nowrap;box-shadow:0 0 16px #e8303a55}
.rbtn:disabled{filter:grayscale(.7);box-shadow:none;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);background:#030c1c;border:1px solid #0e2840;border-radius:5px;padding:6px 11px;cursor:pointer;transition:border-color .12s,color .12s}
.chip:hover{border-color:var(--teal);color:var(--ink)}
.foot{text-align:center;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:var(--faint);text-transform:uppercase}

.zzz text{opacity:0}
.sleeping .zz1{animation:zf 2.2s ease-in-out infinite}
.sleeping .zz2{animation:zf 2.2s ease-in-out infinite .55s}
.sleeping .zz3{animation:zf 2.2s ease-in-out infinite 1.1s}
@keyframes zf{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(4px,-11px)}}
</style>
</head><body><div class="page">
<div class="topbar">
  <div><div class="tl">&#9651; ORBIT</div><div class="ts">MISSION COMMAND VESSEL &middot; DECK A</div></div>
  <div class="tr">
    <span><span class="dot dg"></span>ENGINES</span>
    <span><span class="dot dg"></span>SHIELDS</span>
    <span><span class="dot da"></span>COMMS</span>
    <span id="clk">--:--:--</span>
    <span><span class="dot dg" id="dled"></span><span id="pill">CREW READY</span></span>
  </div>
</div>
<div class="ship-wrap"><svg id="scene" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div class="term-wrap">
  <div class="tbar"><span class="tdots"><i></i><i></i><i></i></span><span class="tlbl">orbit@crew ~/orbitcrm &mdash; mission terminal</span></div>
  <div class="tbody" id="term"></div>
</div>
<div class="ctrl">
  <div class="clbl">Dispatch Order</div>
  <div class="crow"><input class="cinp" id="cmd" autocomplete="off" placeholder="e.g. Find 100 businesses that need websites"/><button class="rbtn" id="run">DISPATCH</button></div>
  <div class="chips" id="chips"></div>
</div>
<div class="foot">Orbit Mission Deck &middot; same crew runs inside your app</div>
</div>
<script>
(function(){
"use strict";
var NS='http://www.w3.org/2000/svg';
var scene=document.getElementById('scene');
var W=900,H=480;

function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||scene).appendChild(e);return e;}
function elg(a,p){return el('g',a||{},p||scene);}

// ===== DRAW SHIP BACKGROUND =====
// Hull bg
el('rect',{x:0,y:0,width:W,height:H,fill:'#030a12'});
el('rect',{x:0,y:0,width:W,height:52,fill:'#060f1e'});
el('rect',{x:0,y:50,width:W,height:2,fill:'#0e2840'});
for(var cp=0;cp<9;cp++)el('rect',{x:cp*102,y:2,width:100,height:48,rx:2,fill:'#040c1a',stroke:'#0a1e30','stroke-width':.8});
for(var cl=0;cl<5;cl++){var cx2=90+cl*180;el('rect',{x:cx2-28,y:44,width:56,height:6,rx:3,fill:'#00e5ff',opacity:.5});el('ellipse',{cx:cx2,cy:120,rx:85,ry:70,fill:'#00e5ff',opacity:.025});}

// Viewport
el('rect',{x:60,y:6,width:780,height:38,rx:4,fill:'#020810',stroke:'#1a3a5a','stroke-width':1.5});
for(var si=0;si<110;si++){var sx=65+Math.random()*770,sy=9+Math.random()*30;el('circle',{cx:sx.toFixed(1),cy:sy.toFixed(1),r:(Math.random()<.12?1.3:.5).toFixed(1),fill:'#fff',opacity:(.25+Math.random()*.7).toFixed(2)});}
[[180,24,'#00e5ff',.8],[620,28,'#f0c96b',.7],[800,20,'#a78bfa',.75]].forEach(function(s){el('circle',{cx:s[0],cy:s[1],r:1.8,fill:s[2],opacity:s[3]});});
el('circle',{cx:740,cy:24,r:16,fill:'#122040',opacity:.9});el('circle',{cx:735,cy:19,r:6,fill:'#1e3060',opacity:.65});el('ellipse',{cx:740,cy:24,rx:24,ry:6,fill:'none',stroke:'#3a6090','stroke-width':1.5,opacity:.5});
el('ellipse',{cx:300,cy:22,rx:80,ry:18,fill:'#00e5ff',opacity:.03});el('ellipse',{cx:580,cy:20,rx:70,ry:15,fill:'#a78bfa',opacity:.035});
[80,220,380,540,700,820].forEach(function(bx){el('circle',{cx:bx,cy:6,r:2.2,fill:'#1a3050'});el('circle',{cx:bx,cy:44,r:2.2,fill:'#1a3050'});});

// Status strip
el('rect',{x:0,y:52,width:W,height:22,fill:'#040c1a'});
el('rect',{x:0,y:74,width:W,height:1,fill:'#0e2840'});
['SYS:NOMINAL','ORBIT:STABLE','CREW:6 ON DECK','AI:ONLINE'].forEach(function(s,i){var t=el('text',{x:55+i*218,y:67,fill:['#00e5ff','#36d399','#f0c96b','#a78bfa'][i],'font-family':"'JetBrains Mono'",'font-size':9.5,opacity:.75});t.textContent=s;});

// Side panels
el('rect',{x:0,y:52,width:20,height:H-52,fill:'#04101e',stroke:'#0e2840','stroke-width':.8});
el('rect',{x:W-20,y:52,width:20,height:H-52,fill:'#04101e',stroke:'#0e2840','stroke-width':.8});
['#36d399','#f4b942','#00e5ff','#a78bfa','#fb923c','#e8303a'].forEach(function(c,i){el('rect',{x:3,y:90+i*28,width:14,height:4,rx:1,fill:c,opacity:.6});});
['#7dd3fc','#f472b6','#fb923c','#a78bfa','#00e5ff','#36d399'].forEach(function(c,i){el('rect',{x:W-17,y:90+i*28,width:14,height:4,rx:1,fill:c,opacity:.6});});

// Floor
el('rect',{x:20,y:75,width:W-40,height:H-75,fill:'#030b18'});
for(var fy=0;fy<8;fy++)el('line',{x1:20,y1:96+fy*52,x2:W-20,y2:96+fy*52,stroke:'#08192c','stroke-width':.7,opacity:(1-fy*.11).toFixed(2)});
for(var fx=0;fx<11;fx++)el('line',{x1:20+fx*88,y1:75,x2:20+fx*88,y2:H,stroke:'#08192c','stroke-width':.5,opacity:.5});
el('rect',{x:20,y:H-10,width:W-40,height:10,fill:'#040e1c'});
el('rect',{x:20,y:H-11,width:W-40,height:1.5,fill:'#00e5ff',opacity:.15});

// Server rack (far right)
el('rect',{x:845,y:140,width:32,height:60,rx:2,fill:'#050e1c',stroke:'#0e2840','stroke-width':1});
for(var ri=0;ri<8;ri++)el('rect',{x:848,y:145+ri*7,width:26,height:3,rx:1,fill:ri%2?'#00e5ff':'#36d399',opacity:.55});

// Plants
function plant(px,py){el('rect',{x:px-4,y:py-2,width:8,height:9,rx:2,fill:'#5a2e10'});el('circle',{cx:px,cy:py-5,r:7,fill:'#226644'});el('circle',{cx:px-5,cy:py-1,r:4,fill:'#2a8055'});el('circle',{cx:px+5,cy:py-1,r:4,fill:'#1e6644'});}
plant(38,450);plant(450,458);plant(860,450);

// Briefing board on left wall
el('rect',{x:22,y:180,width:70,height:50,rx:2,fill:'#070f1e',stroke:'#1a3050','stroke-width':1.5});
el('rect',{x:26,y:184,width:62,height:40,fill:'#0a1624'});
el('polyline',{points:'30,218 38,206 46,212 58,198 66,204 76,194',fill:'none',stroke:'#00e5ff','stroke-width':1.5});
el('rect',{x:30,y:216,width:56,height:1,fill:'#1a3050',opacity:.8});
el('rect',{x:30,y:220,width:40,height:1,fill:'#1a3050',opacity:.6});
var bbt=el('text',{x:57,y:240,'text-anchor':'middle',fill:'#2a4a6a','font-family':"'Press Start 2P'",'font-size':5});bbt.textContent='BRIEFING';

// ===== SMALL DESK BUILDER =====
// Each desk: compact ~55x28px, has dual mini-monitors, keyboard, LED
var DESKS={
  nova:  {x:140,y:130,color:'#f0c96b'},
  astra: {x:320,y:100,color:'#00e5ff'},
  orion: {x:520,y:115,color:'#a78bfa'},
  rex:   {x:180,y:310,color:'#fb923c'},
  luna:  {x:400,y:295,color:'#f472b6'},
  vera:  {x:640,y:320,color:'#7dd3fc'}
};
var SCREENS={};
var DESK_GLOWS={};

function buildDesk(name,dx,dy,color){
  var g=elg({},scene);
  // chair behind desk
  el('ellipse',{cx:dx+27,cy:dy+46,rx:14,ry:6,fill:'#05101e',stroke:'#0c2035','stroke-width':1.5},g);
  // desk surface
  el('rect',{x:dx,y:dy,width:55,height:24,rx:2,fill:'#08182c',stroke:'#102238','stroke-width':1},g);
  // desk front panel
  el('rect',{x:dx,y:dy+22,width:55,height:8,rx:1,fill:'#060f20'},g);
  // glow under desk (hidden by default)
  var glow=el('rect',{x:dx-4,y:dy-4,width:63,height:36,rx:4,fill:color,opacity:0},g);
  DESK_GLOWS[name]=glow;
  // left monitor
  el('rect',{x:dx+4,y:dy+3,width:20,height:14,rx:1,fill:'#020810',stroke:color+'55','stroke-width':1},g);
  var s1=el('rect',{x:dx+5,y:dy+4,width:18,height:12,rx:.5,fill:'#08101c'},g);
  // right monitor
  el('rect',{x:dx+28,y:dy+3,width:20,height:14,rx:1,fill:'#020810',stroke:color+'44','stroke-width':1},g);
  var s2=el('rect',{x:dx+29,y:dy+4,width:18,height:12,rx:.5,fill:'#08101c'},g);
  SCREENS[name]=[s1,s2];
  // keyboard
  el('rect',{x:dx+6,y:dy+22,width:32,height:5,rx:1,fill:'#060d1c'},g);
  // LED dots
  el('circle',{cx:dx+44,cy:dy+25,r:2,fill:color,opacity:.7},g);
  el('circle',{cx:dx+50,cy:dy+25,r:2,fill:'#36d399',opacity:.6},g);
  // name label
  var nt=el('text',{x:dx+27,y:dy-5,'text-anchor':'middle',fill:color,'font-family':"'Press Start 2P'",'font-size':5.5,opacity:.9},g);
  nt.textContent=name.toUpperCase();
}

Object.keys(DESKS).forEach(function(k){var d=DESKS[k];buildDesk(k,d.x,d.y,d.color);});

function setScreen(name,mode){
  var arr=SCREENS[name];if(!arr)return;
  var glow=DESK_GLOWS[name];
  if(mode==='work'){
    arr[0].setAttribute('fill','#e8303a');arr[1].setAttribute('fill','#c02828');
    if(glow)glow.setAttribute('opacity','0.08');
  }else if(mode==='done'){
    arr[0].setAttribute('fill','#1f9f76');arr[1].setAttribute('fill','#147055');
    if(glow)glow.setAttribute('opacity','0.06');
  }else{
    arr[0].setAttribute('fill','#08101c');arr[1].setAttribute('fill','#08101c');
    if(glow)glow.setAttribute('opacity','0');
  }
}

// ===== ASTRONAUT BUILDER =====
// Small but detailed pixel astronauts that walk around
function makeAstro(parent,color){
  var g=elg({},parent);
  // shadow
  el('ellipse',{cx:0,cy:10,rx:8,ry:2.5,fill:'#000',opacity:.35},g);
  // boots
  var bl=el('rect',{x:-5,y:5,width:4,height:5,rx:1.5,fill:'#c8d8e8'},g);
  var br=el('rect',{x:1,y:5,width:4,height:5,rx:1.5,fill:'#c8d8e8'},g);
  // body group (animates)
  var body=elg({},g);
  // suit
  el('rect',{x:-5,y:-5,width:10,height:11,rx:4,fill:'#e0eaf4'},body);
  // chest stripe
  el('rect',{x:-5,y:-1,width:10,height:3,fill:color,opacity:.85},body);
  // badge
  el('rect',{x:-2,y:-2,width:4,height:3,rx:.8,fill:color},body);
  // arms
  el('rect',{x:-8,y:-4,width:3,height:7,rx:1.5,fill:'#ccd8e8'},body);
  el('rect',{x:5,y:-4,width:3,height:7,rx:1.5,fill:'#ccd8e8'},body);
  // gloves
  el('ellipse',{cx:-6.5,cy:3,rx:2.5,ry:2,fill:color,opacity:.8},body);
  el('ellipse',{cx:6.5,cy:3,rx:2.5,ry:2,fill:color,opacity:.8},body);
  // helmet
  el('circle',{cx:0,cy:-10,r:6.5,fill:'#eaf2fc'},body);
  // visor
  el('path',{d:'M-4.5 -11.5 a4.5 4.5 0 0 1 9 0 a4.5 4.5 0 0 1 -9 0Z',fill:'#07101e'},body);
  // visor reflection
  var vr=el('ellipse',{cx:-1.5,cy:-12,rx:2,ry:1.4,fill:color,opacity:.7},body);
  // visor glow (active)
  el('path',{d:'M-3.5 -11.5 a3.5 3.5 0 0 1 7 0 a3.5 3.5 0 0 1 -7 0Z',fill:color,opacity:0,class:'vglow'},body);
  // antenna
  el('line',{x1:0,y1:-17,x2:0,y2:-14,stroke:color,'stroke-width':1.4},body);
  var ant=el('circle',{cx:0,cy:-18,r:2,fill:color,opacity:.85},body);
  // zzz group
  var zg=elg({'class':'zzz'},g);
  var z1=el('text',{x:5,y:-18,'class':'zz1',fill:'#aaddc8','font-family':"'Press Start 2P'",'font-size':4.5},zg);z1.textContent='z';
  var z2=el('text',{x:8,y:-22,'class':'zz2',fill:'#aaddc8','font-family':"'Press Start 2P'",'font-size':5.5},zg);z2.textContent='z';
  var z3=el('text',{x:11,y:-26,'class':'zz3',fill:'#aaddc8','font-family':"'Press Start 2P'",'font-size':6.5},zg);z3.textContent='z';
  return {g:g,bl:bl,br:br,body:body,vr:vr,ant:ant,zg:zg};
}

// ===== AGENTS =====
var COLORS={nova:'#f0c96b',astra:'#00e5ff',orion:'#a78bfa',rex:'#fb923c',luna:'#f472b6',vera:'#7dd3fc'};
var NAMES_ROLES={nova:'Director',astra:'Lead Gen',orion:'Web Dev',rex:'Sales',luna:'App Dev',vera:'Ops'};
var KEYS=['nova','astra','orion','rex','luna','vera'];

// Wander points across the ship floor
var WPT=[
  {x:120,y:200},{x:250,y:380},{x:390,y:440},{x:550,y:380},{x:700,y:420},
  {x:820,y:280},{x:700,y:160},{x:500,y:200},{x:300,y:260},{x:150,y:340},
  {x:450,y:310},{x:620,y:240},{x:350,y:170},{x:80,y:290},{x:760,y:350}
];

var MEET_POS=[
  {x:340,y:220},{x:380,y:240},{x:420,y:220},{x:340,y:260},{x:380,y:280},{x:420,y:260}
];

var AG={};
KEYS.forEach(function(k,i){
  var d=DESKS[k];
  var start={x:d.x+27,y:d.y+50};
  var spr=makeAstro(scene,COLORS[k]);
  AG[k]={
    spr:spr,x:start.x,y:start.y,
    tx:start.x,ty:start.y,
    state:'wander',pause:Math.random()*3,
    phase:Math.random()*6,speed:28+Math.random()*14,
    key:k,meetIdx:i
  };
  spr.g.setAttribute('transform','translate('+start.x+','+start.y+')');
});

function deskPos(k){var d=DESKS[k];return {x:d.x+27,y:d.y+50};}

function pickWander(a){
  var wp=WPT[Math.floor(Math.random()*WPT.length)];
  a.tx=wp.x+(Math.random()*30-15);
  a.ty=wp.y+(Math.random()*20-10);
  // clamp to floor
  a.tx=Math.max(35,Math.min(W-35,a.tx));
  a.ty=Math.max(90,Math.min(H-20,a.ty));
}

// ===== ANIMATION LOOP =====
var last=0;
function frame(t){
  var dt=Math.min(.05,(t-last)/1000||0);last=t;
  KEYS.forEach(function(k){
    var a=AG[k];

    // Work state: locked at desk
    if(a.state==='work'){
      var dp=deskPos(k);
      a.x=dp.x;a.y=dp.y;a.tx=dp.x;a.ty=dp.y;
      a.spr.g.setAttribute('transform','translate('+a.x.toFixed(1)+','+a.y.toFixed(1)+')');
      // visor pulse
      var vg=a.spr.body.querySelector('.vglow');
      if(vg)vg.setAttribute('opacity',(0.4+Math.abs(Math.sin(t/200))*0.5).toFixed(2));
      a.spr.ant.setAttribute('fill','#e8303a');
      a.spr.ant.setAttribute('r','2.5');
      a.spr.zg.classList.remove('sleeping');
      return;
    }

    // Meet state
    if(a.state==='meet'){
      var mp=MEET_POS[a.meetIdx];
      a.tx=mp.x;a.ty=mp.y;
    }

    var dx=a.tx-a.x,dy=a.ty-a.y,dist=Math.hypot(dx,dy);
    var moving=dist>1.5;

    if(a.state==='wander'&&dist<=2){
      if(a.pause<=0){a.pause=0.8+Math.random()*3;}
      else{a.pause-=dt;if(a.pause<=0)pickWander(a);}
      moving=false;
    }

    if(moving){
      var sp2=a.speed*dt;if(sp2>dist)sp2=dist;
      a.x+=dx/dist*sp2;a.y+=dy/dist*sp2;
      a.phase+=dt*10;
      // walk animation: body bob + leg swing
      a.spr.body.setAttribute('transform','translate(0,'+(Math.sin(a.phase)*0.8).toFixed(2)+')');
      a.spr.bl.setAttribute('y',(5+Math.sin(a.phase)*2).toFixed(2));
      a.spr.br.setAttribute('y',(5-Math.sin(a.phase)*2).toFixed(2));
    }else{
      a.spr.bl.setAttribute('y',5);
      a.spr.br.setAttribute('y',5);
      a.spr.body.setAttribute('transform','translate(0,0)');
    }

    // visor back to color
    var vg2=a.spr.body.querySelector('.vglow');
    if(vg2)vg2.setAttribute('opacity','0');
    a.spr.ant.setAttribute('fill',COLORS[k]);
    a.spr.ant.setAttribute('r','2');

    // Zzz only when stopped and wandering
    if(!moving&&a.state==='wander'){a.spr.g.classList.add('sleeping');}
    else{a.spr.g.classList.remove('sleeping');}

    a.spr.g.setAttribute('transform','translate('+a.x.toFixed(1)+','+a.y.toFixed(1)+')');
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function setState(k,st){if(AG[k])AG[k].state=st;}

// ===== TERMINAL =====
function tick(){var d=new Date();document.getElementById('clk').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)+' UTC';}
tick();setInterval(tick,1000);

var term=document.getElementById('term');
function row(h){var l=document.createElement('div');l.className='ln';l.innerHTML=h;term.appendChild(l);term.scrollTop=term.scrollHeight;return l;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function out(c,t){row('<span class="'+c+'">'+esc(t)+'</span>');}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function typeCmd(t){
  var l=row('<span class="pr">orbit &#10095; </span><span class="cm"></span><span class="cur"></span>');
  var sp=l.querySelector('.cm'),c=l.querySelector('.cur');
  for(var i=0;i<t.length;i++){sp.textContent+=t[i];term.scrollTop=term.scrollHeight;await wait(9+Math.random()*14);}
  c.remove();
}
async function prog(lbl){
  var l=row('<span class="mu">'+esc(lbl)+' </span><span class="ba"></span>');
  var b=l.querySelector('.ba');
  var B=['░░░░░░░░░░','▓▓▓░░░░░░░','▓▓▓▓▓▓░░░░','▓▓▓▓▓▓▓▓▓░','▓▓▓▓▓▓▓▓▓▓'];
  for(var i=0;i<B.length;i++){b.textContent=B[i]+' '+(i*25)+'%';term.scrollTop=term.scrollHeight;await wait(115);}
  b.innerHTML='▓▓▓▓▓▓▓▓▓▓ <span class="ok">DONE</span>';
}
function diff(f,a,d){row('<span class="fi">'+esc(f)+'</span>');row('<span class="ad">++ '+a+'</span>  <span class="de">-- '+d+'</span>');}

function route(o){
  o=o.toLowerCase();var s={};
  if(/research|find|analyz|intel|lead|business|prospect|scrape/.test(o))s.astra=1;
  if(/landing|web|page|html|site|seo|design|ui|dashboard/.test(o))s.orion=1;
  if(/app|automat|backend|api|sms|email|crm|trigger|contact/.test(o))s.luna=1;
  if(/sales|pipeline|deal|close|quota|revenue|follow.?up/.test(o))s.rex=1;
  if(/ops|report|analytic|metric|kpi|track|monitor|status/.test(o))s.vera=1;
  if(/everything|whole|full|launch|mvp|all/.test(o)){s.astra=1;s.orion=1;s.luna=1;s.rex=1;s.vera=1;}
  var k=Object.keys(s);if(!k.length){s.astra=1;s.luna=1;k=['astra','luna'];}
  return k;
}

function steps(k,o){
  var ol=o.toLowerCase();
  if(k==='astra')return[
    {c:'orbit leadgen --needs-website --area "Santiago DR"',out:[['in','Scanning OSM + Google Maps…']]},
    {p:'Filtering no-website'},{out:[['mu','100 businesses → Orbit pipeline']]},
    {c:'orbit draft-sms --per-lead',out:[['ok','✓ SMS drafted → SMS Drafted stage']]}
  ];
  if(k==='orion'){
    var base=/dashboard|ui/.test(ol)?[{c:'orbit ui scaffold',out:[['in','Generating layout…']]},{p:'Rendering'},{df:['dashboard/page.tsx','96','12']}]:[{c:'orbit web new landing',out:[['in','Scaffolding landing…']]},{p:'Build hero'},{df:['landing/page.tsx','124','0']}];
    return base.concat([{c:'orbit wire form → contacts',out:[['ok','Form → contacts ✓']]},{p:'Lighthouse'},{out:[['mu','Perf 98 · SEO 100']]}]);
  }
  if(k==='luna'){
    if(/sms|email|welcome/.test(ol))return[{c:'orbit secrets check',out:[['ok','Twilio ✓  Resend ✓']]},{c:'orbit fn deploy welcome',out:[['in','Deploying…']]},{p:'Install trigger'},{df:['welcome.ts','71','0']},{c:'orbit test send',out:[['ok','✓ SMS + email confirmed']]}];
    return[{c:'orbit gen api --route contacts',out:[['in','Scaffolding…']]},{p:'Build + auth'},{df:['api/contacts/route.ts','58','4']},{c:'orbit deploy --preview',out:[['ok','✓ Preview live']]}];
  }
  if(k==='rex')return[{c:'orbit pipeline update --stage Follow-up',out:[['in','Syncing warm leads…']]},{p:'Updating stages'},{out:[['mu','8 deals → Proposal · avg $4.2k']]},{c:'orbit task create --follow-up --bulk',out:[['ok','✓ 12 follow-up tasks created']]}];
  if(k==='vera')return[{c:'orbit report weekly --workspace',out:[['in','Pulling metrics…']]},{p:'Aggregating KPIs'},{out:[['mu','Pipeline: $42k · Win rate: 68%']]},{c:'orbit alert set --threshold 0.70',out:[['ok','✓ Alerts configured']]}];
  return[];
}

async function runAgent(k,order){
  setState(k,'work');setScreen(k,'work');
  out('hd','── '+k.toUpperCase()+' ──────');
  await wait(550);
  var ST=steps(k,order);
  for(var i=0;i<ST.length;i++){
    var s=ST[i];
    if(s.c)await typeCmd(s.c);
    if(s.out)for(var j=0;j<s.out.length;j++){out(s.out[j][0],s.out[j][1]);await wait(240+Math.random()*160);}
    if(s.p)await prog(s.p);
    if(s.df)diff(s.df[0],s.df[1],s.df[2]);
    await wait(110);
  }
  setScreen(k,'done');
  await wait(2000);
  setScreen(k,'idle');
  setState(k,'wander');
  pickWander(AG[k]);
}

var running=false;
var pill=document.getElementById('pill');
var dled=document.getElementById('dled');
var runBtn=document.getElementById('run');

async function run(order){
  if(running)return;
  running=true;runBtn.disabled=true;
  pill.textContent='DISPATCHING';
  dled.className='dot dr';
  out('in','NOVA: all crew to briefing positions…');
  KEYS.forEach(function(k){setState(k,'meet');});
  await typeCmd('orbit dispatch "'+order+'"');
  await wait(1400);
  var crew=route(order);
  out('mu','Crew assigned: '+crew.map(function(k){return k.toUpperCase();}).join(', '));
  await wait(350);
  // non-assigned crew back to wander
  KEYS.forEach(function(k){if(crew.indexOf(k)<0&&k!=='nova')setState(k,'wander');});
  setState('nova','wander');
  // run agents
  for(var i=0;i<crew.length;i++){await runAgent(crew[i],order);await wait(180);}
  out('ok','✔ Mission complete — deliverables shipped.');
  row('<span class="pr">orbit &#10095; </span><span class="cur"></span>');
  pill.textContent='CREW READY';
  dled.className='dot dg';
  running=false;runBtn.disabled=false;
}

var QUICK=['Find 100 businesses that need websites','Build a lead-capture landing page','Add an SMS + email welcome flow','Update sales pipeline + follow-ups','Generate weekly ops report','Full launch: CRM + leads + site + ops'];
var chips=document.getElementById('chips');
QUICK.forEach(function(q){var c=document.createElement('button');c.className='chip';c.textContent=q;c.onclick=function(){if(running)return;document.getElementById('cmd').value=q;run(q);};chips.appendChild(c);});
runBtn.onclick=function(){var v=document.getElementById('cmd').value.trim();if(!v){out('wa','Type a mission order first.');return;}run(v);};
document.getElementById('cmd').addEventListener('keydown',function(e){if(e.key==='Enter'){var v=this.value.trim();if(v)run(v);}});

out('mu','Orbit Mission Deck online — 6-agent crew on deck.');
out('mu','Crew wanders freely. Dispatch a mission to lock them in.');
row('<span class="pr">orbit &#10095; </span><span class="cur"></span>');
})();

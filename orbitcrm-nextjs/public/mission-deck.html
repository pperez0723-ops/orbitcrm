<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ORBIT · Mission Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#04080f;--hull:#060d18;--hull2:#0a1526;--panel:#091322;
  --red:#e8303a;--rs:#ff5d66;--amber:#f4b942;--teal:#00e5ff;
  --green:#36d399;--violet:#a78bfa;--pink:#f472b6;--orange:#fb923c;
  --ice:#7dd3fc;--gold:#f0c96b;
  --ink:#e8f4ff;--dim:#7a9ab8;--faint:#3a5a78;
  --glow-r:0 0 20px #e8303a88,0 0 60px #e8303a33;
  --glow-c:0 0 20px #00e5ff88,0 0 60px #00e5ff22;
  --glow-g:0 0 15px #36d39966;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Orbitron',monospace;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100dvh}
.page{max-width:1280px;margin:0 auto;padding:12px 16px 32px}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:linear-gradient(180deg,#0d1f35,#060d18);border-bottom:1px solid #1a3050;margin-bottom:12px}
.topbar-logo{font-size:18px;font-weight:900;letter-spacing:.15em;color:var(--teal);text-shadow:var(--glow-c)}
.topbar-title{font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.topbar-status{display:flex;gap:16px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.s-green{background:var(--green);box-shadow:var(--glow-g)}
.s-amber{background:var(--amber)}
.s-red{background:var(--red);box-shadow:var(--glow-r);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
#clock{color:var(--teal);letter-spacing:.12em}

/* COCKPIT VIEWPORT */
.cockpit{position:relative;width:100%;background:var(--hull);border:1px solid #1a3050;border-radius:8px;overflow:hidden;margin-bottom:12px}
.cockpit svg{width:100%;display:block}

/* TERMINAL */
.terminal-wrap{background:#020810;border:1px solid #1a3050;border-radius:8px;overflow:hidden;margin-bottom:12px}
.term-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#050f1c;border-bottom:1px solid #1a3050}
.term-bar .tdots{display:flex;gap:5px}.term-bar .tdots i{width:10px;height:10px;border-radius:50%}
.term-bar .tdots i:nth-child(1){background:#ff5f57}.term-bar .tdots i:nth-child(2){background:#febc2e}.term-bar .tdots i:nth-child(3){background:#28c840}
.term-bar .tlbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;margin-left:4px}
.term-body{height:220px;overflow-y:auto;padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.65;background:#020810}
.term-body::-webkit-scrollbar{width:6px}.term-body::-webkit-scrollbar-thumb{background:#1a3050;border-radius:3px}
.ln{display:flex;gap:8px;white-space:pre-wrap;word-break:break-word;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}}
.prompt{color:var(--rs)}.cmd{color:var(--ink)}.ok{color:var(--green)}.warn{color:var(--amber)}.info{color:var(--teal)}.mut{color:var(--dim)}.file{color:var(--violet)}.add{color:var(--green)}.del{color:#ff7a82}.bar{color:var(--red)}.hdr{color:var(--faint)}
.cur{display:inline-block;width:7px;height:13px;background:var(--red);vertical-align:-2px;animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}

/* CONTROLS */
.ctrl{background:var(--panel);border:1px solid #1a3050;border-radius:8px;padding:14px}
.ctrl-lbl{font-size:7px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:10px}
.ctrl-row{display:flex;gap:8px}
.ctrl-input{flex:1;background:#030b16;border:1px solid #1a3050;border-radius:6px;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:13px;padding:12px 14px}
.ctrl-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px #00e5ff22}
.ctrl-input::placeholder{color:var(--faint)}
.run-btn{background:linear-gradient(180deg,var(--red),#9a0f17);border:none;border-radius:6px;padding:0 22px;color:#fff;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;cursor:pointer;white-space:nowrap;box-shadow:var(--glow-r)}
.run-btn:disabled{filter:grayscale(.7);box-shadow:none;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);background:#040c1a;border:1px solid #1a3050;border-radius:6px;padding:7px 12px;cursor:pointer;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--teal);color:var(--ink)}

.footer{text-align:center;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase}

/* Zzz */
.zzz text{opacity:0}
.sleeping .zz1{animation:zf 2.4s ease-in-out infinite}
.sleeping .zz2{animation:zf 2.4s ease-in-out infinite .6s}
.sleeping .zz3{animation:zf 2.4s ease-in-out infinite 1.2s}
@keyframes zf{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(5px,-12px)}}

/* Active agent glow */
.agent-active .screen-main{fill:var(--red)!important}
.agent-active .visor{fill-opacity:.95!important}
</style>
</head>

<script>
(function(){
// Clock
function tick(){
  var d=new Date();
  document.getElementById('clock').textContent=
    ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)+' UTC';
}
tick();setInterval(tick,1000);

// Agent colors map
var AGENT_COLORS={nova:'#f0c96b',astra:'#00e5ff',orion:'#a78bfa',luna:'#f472b6',rex:'#fb923c',vera:'#7dd3fc'};

// Screen state: set screen fill + glow
function setScreen(name, mode){
  var s1=document.getElementById('scr-'+name);
  var s2=document.getElementById('scr-'+name+'-inner');
  if(!s1)return;
  if(mode==='work'){
    s1.setAttribute('fill','#1a0810');
    s1.setAttribute('stroke',AGENT_COLORS[name]+'cc');
    if(s2)s2.setAttribute('fill','#e8303a');
    // visor glow
    var vg=document.querySelector('.astro-'+name+' .visor-glow');
    if(vg)vg.setAttribute('opacity','0.6');
    var vs=document.querySelector('.astro-'+name+' .visor-shine');
    if(vs)vs.setAttribute('opacity','1');
    // antenna pulse
    var ant=document.querySelector('.astro-'+name+' .antenna-dot');
    if(ant){ant.setAttribute('fill','#e8303a');ant.style.filter='drop-shadow(0 0 4px #e8303a)';}
    // zzz off
    var az=document.querySelector('.astro-'+name+' .zzz');
    if(az)az.closest('.astro-body').closest('g').classList.remove('sleeping');
  } else if(mode==='done'){
    s1.setAttribute('fill','#081a10');
    s1.setAttribute('stroke',AGENT_COLORS[name]+'aa');
    if(s2)s2.setAttribute('fill','#1f9f76');
    var vg2=document.querySelector('.astro-'+name+' .visor-glow');
    if(vg2)vg2.setAttribute('opacity','0.3');
    var ant2=document.querySelector('.astro-'+name+' .antenna-dot');
    if(ant2){ant2.setAttribute('fill',AGENT_COLORS[name]);ant2.style.filter='';}
  } else {
    s1.setAttribute('fill','#020810');
    s1.setAttribute('stroke',AGENT_COLORS[name]+'66');
    if(s2)s2.setAttribute('fill','#0a0f18');
    var vg3=document.querySelector('.astro-'+name+' .visor-glow');
    if(vg3)vg3.setAttribute('opacity','0');
    var vs3=document.querySelector('.astro-'+name+' .visor-shine');
    if(vs3)vs3.setAttribute('opacity','0.7');
    var ant3=document.querySelector('.astro-'+name+' .antenna-dot');
    if(ant3){ant3.setAttribute('fill',AGENT_COLORS[name]);ant3.style.filter='';}
    // idle: zzz
    var bodyG=document.querySelector('.astro-'+name+' .astro-body');
    var parentG=bodyG?bodyG.parentElement:null;
    if(parentG)parentG.classList.add('sleeping');
  }
}

// All idle at start
['nova','astra','orion','luna','rex','vera'].forEach(function(n){setScreen(n,'idle');});

// Terminal
var term=document.getElementById('term');
function row(h){var l=document.createElement('div');l.className='ln';l.innerHTML=h;term.appendChild(l);term.scrollTop=term.scrollHeight;return l;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function out(c,t){row('<span class="'+c+'">'+esc(t)+'</span>');}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function typeCmd(t){
  var l=row('<span class="prompt">orbit &#10095; </span><span class="cmd"></span><span class="cur"></span>');
  var sp=l.querySelector('.cmd'),c=l.querySelector('.cur');
  for(var i=0;i<t.length;i++){sp.textContent+=t[i];term.scrollTop=term.scrollHeight;await wait(9+Math.random()*15);}
  c.remove();
}
async function prog(label){
  var l=row('<span class="mut">'+esc(label)+' </span><span class="bar"></span>');
  var b=l.querySelector('.bar');
  var bars=['░░░░░░░░░░','▓▓▓░░░░░░░','▓▓▓▓▓▓░░░░','▓▓▓▓▓▓▓▓▓░','▓▓▓▓▓▓▓▓▓▓'];
  for(var i=0;i<bars.length;i++){b.textContent=bars[i]+' '+(i*25)+'%';term.scrollTop=term.scrollHeight;await wait(120);}
  b.innerHTML='▓▓▓▓▓▓▓▓▓▓ <span class="ok">DONE</span>';
}
function diff(f,a,d){row('<span class="file">'+esc(f)+'</span>');row('<span class="add">++ '+a+'</span>  <span class="del">-- '+d+'</span>');}

// Route order to agents
function route(o){
  o=o.toLowerCase();var s={};
  if(/research|competitor|market|find|analyz|intel|lead|business|prospect|scrape|website/.test(o))s.astra=1;
  if(/landing|web|page|html|site|seo|copy|hero|design|ui|dashboard/.test(o))s.orion=1;
  if(/app|mobile|feature|component|automat|backend|api|supabase|sms|email|crm|trigger|contact|task/.test(o))s.luna=1;
  if(/sales|pipeline|deal|close|prospect|quota|revenue|follow.?up/.test(o))s.rex=1;
  if(/ops|report|analytic|metric|kpi|track|monitor|status/.test(o))s.vera=1;
  if(/everything|orbit|whole|full|launch|mvp|all/.test(o)){s.astra=1;s.orion=1;s.luna=1;s.rex=1;s.vera=1;}
  var k=Object.keys(s);
  if(!k.length){s.astra=1;s.luna=1;k=['astra','luna'];}
  return k;
}

// Steps per agent
function steps(k,o){
  var ol=o.toLowerCase();
  if(k==='astra')return[
    {c:'orbit leadgen --needs-website --area "Santiago DR"',out:[['info','Scanning OSM + Google Maps directory…']]},
    {p:'Filtering: no-website'},
    {out:[['mut','Found 100 businesses → Orbit pipeline (New)']]},
    {c:'orbit draft-sms --per-lead',out:[['ok','✓ SMS drafted → moved to "SMS Drafted"']]}
  ];
  if(k==='orion'){
    var base=/dashboard|ui|design/.test(ol)?[
      {c:'orbit ui scaffold --component dashboard',out:[['info','Generating layout…']]},
      {p:'Rendering components'},{df:['dashboard/page.tsx','96','12']}
    ]:[
      {c:'orbit web new landing --with-form',out:[['info','Scaffolding landing + lead form…']]},
      {p:'Building hero section'},{df:['landing/page.tsx','124','0']}
    ];
    return base.concat([{c:'orbit wire form → contacts',out:[['ok','Form submissions → contacts ✓']]},{p:'Lighthouse audit'},{out:[['mut','Perf 98 · A11y 96 · SEO 100']]}]);
  }
  if(k==='luna'){
    if(/sms|email|welcome|trigger/.test(ol))return[
      {c:'orbit secrets check',out:[['ok','Twilio ✓  Resend ✓']]},
      {c:'orbit fn deploy welcome-message',out:[['info','Deploying edge function…']]},
      {p:'Installing trigger'},{df:['welcome-message.ts','71','0']},
      {c:'orbit test send --dry-run',out:[['ok','✓ SMS + email confirmed']]}
    ];
    return[{c:'orbit gen api --route contacts',out:[['info','Scaffolding endpoint…']]},{p:'Build + auth guard'},{df:['api/contacts/route.ts','58','4']},{c:'orbit deploy --preview',out:[['ok','✓ Preview deployed']]}];
  }
  if(k==='rex')return[
    {c:'orbit pipeline update --stage "Follow-up" --bulk',out:[['info','Syncing warm leads…']]},
    {p:'Updating CRM stages'},
    {out:[['mut','8 deals → stage "Proposal" · avg value $4.2k']]},
    {c:'orbit task create --follow-up --bulk --all-warm',out:[['ok','✓ 12 follow-up tasks created']]}
  ];
  if(k==='vera')return[
    {c:'orbit report weekly --workspace --all',out:[['info','Pulling workspace metrics…']]},
    {p:'Aggregating KPIs'},
    {out:[['mut','Pipeline: $42k · Deals: 23 · Win rate: 68%']]},
    {c:'orbit alert set --threshold 0.70 --metric conversion',out:[['ok','✓ Alert triggers configured']]}
  ];
  return[];
}

// Run a single agent
async function runAgent(k,order){
  setScreen(k,'work');
  out('hdr','── '+k.toUpperCase()+' ─────────');
  await wait(600);
  var ST=steps(k,order);
  for(var i=0;i<ST.length;i++){
    var s=ST[i];
    if(s.c)await typeCmd(s.c);
    if(s.out)for(var j=0;j<s.out.length;j++){out(s.out[j][0],s.out[j][1]);await wait(260+Math.random()*180);}
    if(s.p)await prog(s.p);
    if(s.df)diff(s.df[0],s.df[1],s.df[2]);
    await wait(120);
  }
  setScreen(k,'done');
  await wait(2200);
  setScreen(k,'idle');
}

// Main dispatch
var running=false;
var pill=document.getElementById('pill');
var dled=document.getElementById('dled');
var runBtn=document.getElementById('run');

async function run(order){
  if(running)return;
  running=true;runBtn.disabled=true;
  pill.textContent='DISPATCHING';
  dled.className='status-dot s-red';
  out('info','NOVA: all crew to briefing stations…');
  setScreen('nova','work');
  await typeCmd('orbit dispatch "'+order+'"');
  await wait(1200);
  var crew=route(order);
  out('mut','Crew assigned: '+crew.map(function(k){return k.toUpperCase();}).join(', '));
  await wait(400);
  setScreen('nova','idle');
  for(var i=0;i<crew.length;i++){
    await runAgent(crew[i],order);
    await wait(200);
  }
  out('ok','✔ Mission complete — all deliverables shipped.');
  row('<span class="prompt">orbit &#10095; </span><span class="cur"></span>');
  pill.textContent='CREW READY';
  dled.className='status-dot s-green';
  running=false;runBtn.disabled=false;
}

// Chips
var QUICK=[
  'Find 100 businesses that need websites',
  'Build a lead-capture landing page',
  'Add an SMS + email welcome flow',
  'Update sales pipeline + follow-ups',
  'Generate weekly ops report',
  'Full launch: CRM + leads + site + ops'
];
var chips=document.getElementById('chips');
QUICK.forEach(function(q){
  var c=document.createElement('button');c.className='chip';c.textContent=q;
  c.onclick=function(){if(running)return;document.getElementById('cmd').value=q;run(q);};
  chips.appendChild(c);
});
runBtn.onclick=function(){var v=document.getElementById('cmd').value.trim();if(!v){out('warn','Type a mission order first.');return;}run(v);};
document.getElementById('cmd').addEventListener('keydown',function(e){if(e.key==='Enter'){var v=this.value.trim();if(v)run(v);}});

// Boot message
out('mut','Orbit Mission Deck online — 6-agent crew at stations.');
out('mut','Select a chip or type a mission order to dispatch the crew.');
row('<span class="prompt">orbit &#10095; </span><span class="cur"></span>');
})();
